name: CI

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main" ]
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  lint-shell:
    name: Lint — Shell (shellcheck)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2

      - name: Install shellcheck
        run: sudo apt-get install -y shellcheck

      - name: Run shellcheck on monitor.sh
        run: shellcheck -x monitor.sh

  lint-python:
    name: Lint — Python (flake8)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2

      - name: Set up Python 3.11
        uses: actions/setup-python@v5.4.0
        with:
          python-version: "3.11"

      - name: Install flake8
        run: pip install flake8

      - name: Run flake8 on report.py
        run: flake8 report.py --max-line-length=100

  test-python:
    name: Test — report.py unit
    runs-on: ubuntu-latest
    needs: lint-python
    steps:
      - uses: actions/checkout@v4.2.2

      - name: Set up Python 3.11
        uses: actions/setup-python@v5.4.0
        with:
          python-version: "3.11"

      - name: Run report.py with sample log data
        run: |
          mkdir -p /tmp/wdog-test
          cat > /tmp/wdog-test/metrics_test.json <<'EOF'
          {"timestamp":"2024-01-01 12:00:00","cpu":{"usage_pct":22.5,"status":"OK"},"memory":{"usage_pct":55.1,"status":"OK","detail":"3500MB / 8000MB"},"disk":{"usage_pct":40,"status":"OK","detail":"40GB used / 100GB total"},"host":"ci-runner"}
          {"timestamp":"2024-01-01 12:01:00","cpu":{"usage_pct":87.3,"status":"CRITICAL"},"memory":{"usage_pct":91.0,"status":"CRITICAL","detail":"7280MB / 8000MB"},"disk":{"usage_pct":88,"status":"CRITICAL","detail":"88GB used / 100GB total"},"host":"ci-runner"}
          EOF
          python3 report.py /tmp/wdog-test/metrics_test.json /tmp/wdog-test/report.html
          test -f /tmp/wdog-test/report.html && echo "HTML report generated"
          grep -q "ci-runner" /tmp/wdog-test/report.html && echo "Host name present in report"
          grep -q "CRITICAL"  /tmp/wdog-test/report.html && echo "CRITICAL status rendered"

  docker-build:
    name: Docker — build image
    runs-on: ubuntu-latest
    needs: [ lint-shell, lint-python ]
    steps:
      - uses: actions/checkout@v4.2.2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3.9.0

      - name: Build Docker image
        run: docker build -t devops-watchdog:ci .

      - name: Verify image exists
        run: docker image inspect devops-watchdog:ci | grep -i "Architecture"
