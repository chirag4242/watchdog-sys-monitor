# ------------------------------------------------
# DevOps Watchdog — Alert Thresholds
# All values are percentages (integer or float).
# ------------------------------------------------

# ---------------------CPU------------------------
CPU_WARN_THRESHOLD=70 	# Warning above this % (Yellow)
CPU_THRESHOLD=85        # Critical above this (Red)

# ---------------------Memory---------------------
MEM_WARN_THRESHOLD=75
MEM_THRESHOLD=90

# -----------Disk (root filesystem)---------------
DISK_WARN_THRESHOLD=70
DISK_THRESHOLD=85

# -----------Check interval (seconds)-------------
CHECK_INTERVAL=60
